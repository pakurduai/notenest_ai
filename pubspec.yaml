name: notenest_ai
description: "NoteNest - Smart Notes. Smarter Ideas."
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  google_mobile_ads: ^5.1.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/playstore/icon_512.png"
  min_sdk_android: 21
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: "assets/playstore/adaptive_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/branding/app_icon.png
    - assets/branding/full_logo.png
    - assets/branding/monogram.png
    - assets/images/splash_screen_v2.png
    - assets/images/onboarding_screen_1.png
    - assets/images/onboarding_screen_2.png
    - assets/images/
